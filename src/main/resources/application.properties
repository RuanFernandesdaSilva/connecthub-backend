spring.application.name=simpleAuth

# ===================================================================
# CONFIGURAÇÕES DE SERVIDOR E ENCODING
# ===================================================================
spring.mandatory-file-encoding=UTF-8

server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=native

# ===================================================================
# CONFIGURAÇÕES DO BANCO DE DADOS (PostgreSQL)
# ===================================================================
# Em produção (Render), configure a variável SPRING_DATASOURCE_URL com a URL Interna:
# jdbc:postgresql://dpg-dasm3kjbc2fs73fs8kvg-a/connecthub_db_tdyr
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-dasm3kjbc2fs73fs8kvg-a.oregon-postgres.render.com:5432/connecthub_db_tdyr?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:connecthub_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dhcY4oWiXqc7RAZbdAcPAzXGgttP3zC7}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Pool de Conexões (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=0

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===================================================================
# SESSÃO E SEGURANÇA CROSS-DOMAIN (Vercel <-> Render)
# ===================================================================
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=1d

# URL Base do Front-End (Vercel)
app.frontend.url=${APP_FRONTEND_URL:https://connecthub-frontend-three.vercel.app}

# ===================================================================
# BOTS DO TELEGRAM
# Fallbacks fictícios ("dummy_token") evitam que a aplicação falhe ao iniciar localmente
# ===================================================================
# Bot Central (Hub)
telegram.bot.hub.token=${TELEGRAM_BOT_HUB_TOKEN:dummy_token_hub}
telegram.bot.hub.username=${TELEGRAM_BOT_HUB_USERNAME:ConnectHubSpoke_bot}

# Bot Médico
telegram.bot.med.token=${TELEGRAM_BOT_MED_TOKEN:dummy_token_med}
telegram.bot.med.username=${TELEGRAM_BOT_MED_USERNAME:NotificaMedBot}

# Bot de Eventos
telegram.bot.evento.token=${TELEGRAM_BOT_EVENTO_TOKEN:dummy_token_evento}
telegram.bot.evento.username=${TELEGRAM_BOT_EVENTO_USERNAME:NotificaEventoBot}

telegram.bot.compra.token=${TELEGRAM_BOT_COMPRA_TOKEN:dummy_token_compra}
telegram.bot.compra.username=${TELEGRAM_BOT_COMPRA_USERNAME:NotificaCompraBot}

# ===================================================================
# LOGGING (Ajustado para nível padrão INFO para evitar poluír logs no Render)
# ===================================================================
logging.level.org.springframework.boot=INFO
logging.level.com.zaxxer.hikari=INFO