spring.application.name=simpleAuth

# Encoding e Charset
spring.mandatory-file-encoding=UTF-8

# Porta do Servidor e Endereço para o Render
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=native

# Configurações do Banco de Dados (Fallback apontando para o Postgres do Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-dasm3kjbc2fs73fs8kvg-a.oregon-postgres.render.com:5432/connecthub_db_tdyr?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:connecthub_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dhcY4oWiXqc7RAZbdAcPAzXGgttP3zC7}
spring.datasource.driver-class-name=org.postgresql.Driver

# Otimização do pool de conexões (Evita estouro de memória no Render)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cookies de Sessão Cross-Domain (Vercel <-> Render)
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=1d

# URL Base do Front-End (Vercel)
app.frontend.url=${APP_FRONTEND_URL:https://connecthub-frontend-three.vercel.app}

# Bot Central (Hub) - Valores sobrescritos pelo Secret File no Render
telegram.bot.hub.token=${TELEGRAM_BOT_HUB_TOKEN:}
telegram.bot.hub.username=${TELEGRAM_BOT_HUB_USERNAME:ConnectHubSpoke_bot}

# Bots Secundários - Valores sobrescritos pelo Secret File no Render
telegram.bot.med.token=${TELEGRAM_BOT_MED_TOKEN:}
telegram.bot.med.username=${TELEGRAM_BOT_MED_USERNAME:NotificaMedBot}

telegram.bot.evento.token=${TELEGRAM_BOT_EVENTO_TOKEN:}
telegram.bot.evento.username=${TELEGRAM_BOT_EVENTO_USERNAME:NotificaEventoBot}

telegram.bot.compra.token=${TELEGRAM_BOT_COMPRA_TOKEN:}
telegram.bot.compra.username=${TELEGRAM_BOT_COMPRA_USERNAME:NotificaCompraBot}